# NCC 项目配置 —— 放在写作项目根目录
# 书库根目录：所有书项目 {书名}/ 的父目录
book_root: ./novels

# 偏好记忆：跨书共享的作者偏好（三层问答用它做推荐与⭐标记）
preferences: ./novels/_preferences.json

# 拆书总纲 5.0 路径：ncc-deconstruct 的字段规范来源（按序探测第一个存在的）
framework_candidates:
  - ./小说拆分总纲5.0.md
  - ~/Documents/word_wx/ai-skills/小说拆分总纲5.0.md
  - ~/Documents/网文拆解/小说拆分总纲5.0.md

# 审稿（三层评价，D13：硬伤层通过/不通过，不打总分）
review:
  min_decidable: 0.8    # 硬伤层可判定率下限（能下结论的检查项占比）
  max_retry: 3          # 同章重写上限

# 新书默认写作模式：建筑师 | 园丁 | 混合（D15）
default_mode: 混合

# 每章机械检查（check_chapter.py 用）
chapter:
  words_min: 3000
  words_max: 5000
  ai_level1_max: 3      # 高危句式（五星除外）与一级禁用词合计上限；五星句式出现即须改

# 作者可持续（sustain.md）
sustain:
  buffer_min: 5         # 存稿线：已定稿未发布的章数低于它时，推荐保更模式
