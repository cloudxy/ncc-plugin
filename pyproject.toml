[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ncc-data"
version = "4.0.0"
description = "NCC private novel data service, management console and creative automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[project.scripts]
ncc-data = "ncc_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ncc_data"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "ncc_data/migrations"
"alembic.ini" = "ncc_data/alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests/data"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
